<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>

    <!-- ─── Navigation ──────────────────────────────────── -->
    <nav>
        <div class="nav-inner">
            <a class="nav-brand" href="index.html">
                <div class="nav-avatar">
                    <img src="assets/images/logo/dalynPf.png" alt="Ra Dalin" />
                </div>
                <span class="nav-name">Ra Dalin</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html#about" class="nav-link-about">About</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact" class="nav-link-contact">Contact</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text)">
                    <circle cx="12" cy="12" r="5" />
                    <line x1="12" y1="1" x2="12" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="23" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                    <line x1="1" y1="12" x2="3" y2="12" />
                    <line x1="21" y1="12" x2="23" y2="12" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                </svg>
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text)">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
        </div>
    </nav>

    <!-- ─── Detail Body ──────────────────────────────────── -->
    <main>
        <!-- Back -->
        <div style="padding-top: 28px;">
            <a href="index.html#projects" id="backBtn"
                style="display:inline-flex;align-items:center;gap:6px;background:none;border:none;outline:none;padding:0;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--text-2);cursor:pointer;text-decoration:none;transition:color 0.2s;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 5l-7 7 7 7" />
                </svg>
                Projects
            </a>
        </div>

        <!-- Hero -->
        <section id="about"
            style="padding:32px 0 0;display:flex;align-items:flex-start;gap:20px;grid-template-columns:unset;">
            <div id="detail-icon" class="app-icon"
                style="width:80px;height:80px;border-radius:22px;font-size:36px;flex-shrink:0;overflow:hidden;"></div>
            <div style="flex:1;min-width:0;">
                <h1 id="detail-title" class="hero-title" style="font-size:clamp(22px,4vw,32px);margin-bottom:4px;"></h1>
                <p id="detail-subtitle" class="app-subtitle" style="font-size:14px;margin-bottom:12px;"></p>
                <div id="detail-tag-row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"></div>
            </div>
        </section>
        <!-- Screenshots -->
        <div style="border-top:1px solid var(--divider); padding: 24px 24px 24px 40px; margin-top:28px;">
                <p class="section-label" style="margin-bottom:14px;">Screenshots</p>
            <div style="margin:0 -20px;">
                <div id="detail-screens"
                    style="display:flex;gap:10px;overflow-x:scroll;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 20px 8px;cursor:grab;">
                </div>
            </div>
        </div>

        <!-- About -->
        <div style="border-top:1px solid var(--divider);padding:24px 0;">
            <p class="section-label" style="margin-bottom:14px;">About</p>
            <p id="detail-desc" class="hero-sub" style="font-size:15px;margin-bottom:0;max-width:100%;"></p>
        </div>

        <!-- Tech Stack -->
        <div style="border-top:1px solid var(--divider);padding:24px 0;">
            <p class="section-label" style="margin-bottom:14px;">Tech Stack</p>
            <div id="detail-tech" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        </div>

        <!-- Available On -->
        <div style="border-top:1px solid var(--divider);padding:24px 0;">
            <p class="section-label" style="margin-bottom:14px;">Available on</p>
            <div id="detail-badges" class="card-footer" style="padding:0;border:none;margin:0;"></div>
        </div>

    </main>

    <!-- ─── Footer ───────────────────────────────────────── -->
    <footer>
        Designed &amp; coded by Ra Dalin &nbsp;·&nbsp; 2025
    </footer>

    <script>
        // ── Theme ───────────────────────────────────────────
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const saved = localStorage.getItem('theme');
        if (saved) html.setAttribute('data-theme', saved);
        toggle.addEventListener('click', () => {
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });

        // ── Project data ─────────────────────────────────────
        const PROJECT_DATA = {
            folkara: {
                icon: '🌅', iconImg: 'assets/images/screenshotsFolkara/folkaraIcon.png',
                gradient: 'linear-gradient(135deg,#f97316,#ec4899)',
                                title: 'Folkara', subtitle: 'Your Complete HRMS Suite',
                category: 'Productivity & Business', rating: '5.0', ratingCount: '2',
                description: 'Folkara is an all-in-one HR management platform designed to simplify and streamline workforce operations for modern organizations. It covers everything from employee onboarding to real-time performance tracking, with automated GPS-based attendance, biometric login, multi-device linking, and a powerful approval workflow engine that lets admins configure CC rules and custom form access per user.',
              screens: [
                    { bg: 'linear-gradient(160deg,#1e0a2e,#3b1566)', img: 'assets/images/screenshotsFolkara/home.png' },
                    { bg: 'linear-gradient(160deg,#0f2027,#2c5364)', img: 'assets/images/screenshotsFolkara/request.png' },
                    { bg: 'linear-gradient(160deg,#1a0533,#5b2d8e)', img: 'assets/images/screenshotsFolkara/requestDetail.png' },
                    { bg: 'linear-gradient(160deg,#0d1b2a,#1b4f72)', img: 'assets/images/screenshotsFolkara/notifi.png' },
                    
                ],
                tech: ['Flutter', 'Dart', 'REST API', 'Biometrics', 'GPS / Location', 'Push Notifications'],
                badges: [{ type: 'ios', label: 'App Store', href: 'https://apps.apple.com/kh/app/folkara/id6745320437' }]
            },
            photoBoots: {
                icon: '📷', iconImg: 'assets/images/photoBoots/logo.jpg',
                gradient: 'linear-gradient(135deg,#8b5cf6,#3b82f6)',
                                title: 'PhotoBoots', subtitle: 'Photo Editing App',
                category: 'Photography', rating: '—', ratingCount: '—',
                description: 'PhotoBoots is a Korean-style photo booth application allowing users to capture photos with countdown time and select images based on Korean style. Generate customizable photos with frames, backgrounds, emojis and color filters. Implemented camera integration, countdown capture, photo composition, gallery saving, and social sharing.',
                screens: [
                    { bg: 'linear-gradient(160deg,#0a1a3e,#1a3a8a)', img: 'assets/images/photoBoots/home.jpg' },
                    { bg: 'linear-gradient(160deg,#0a1a3e,#1a3a8a)', img: 'assets/images/photoBoots/selectImage.jpg' },
                    { bg: 'linear-gradient(160deg,#0a1a3e,#1a3a8a)', img: 'assets/images/photoBoots/boots.jpg' },
                    { bg: 'linear-gradient(160deg,#0a1a3e,#1a3a8a)', img: 'assets/images/photoBoots/slectedIcon.jpg' },
                    { bg: 'linear-gradient(160deg,#0a1a3e,#1a3a8a)', img: 'assets/images/photoBoots/loading.jpg' },
                ],
                tech: ['Swift', 'UIKit', 'AVFoundation', 'Core Image', 'PhotoKit'],
                badges: [{ type: 'ios', label: 'App Store', href: '#' }]
            },
            homeDecore: {
                icon: '🛋️', iconImg: 'assets/images/homeDecore/logo.jpg',
                gradient: 'linear-gradient(135deg,#f59e0b,#10b981)',
                title: 'Home Decore', subtitle: 'Furniture & Interior Shopping',
                category: 'Ecommerce & Entertainment', rating: '—', ratingCount: '—',
                description: 'Home Decor Store is an e-commerce iOS application designed for browsing and purchasing furniture and home decoration products. The application provides users with a seamless shopping experience, allowing them to explore product categories, view detailed product information, manage their cart, and place orders directly from their mobile devices.',
                screens: [
                    { bg: 'linear-gradient(160deg,#0a1a3e,#1a3a8a)', img: 'assets/images/homeDecore/homeLogin.png' },
                    { bg: 'linear-gradient(160deg,#0a1a3e,#1a3a8a)', img: 'assets/images/homeDecore/shop.png' },
                    { bg: 'linear-gradient(160deg,#0a1a3e,#1a3a8a)', img: 'assets/images/homeDecore/cart.png' },
                    { bg: 'linear-gradient(160deg,#0a1a3e,#1a3a8a)', img: 'assets/images/homeDecore/order.png' },
                ],
                tech: ['Flutter', 'Dart', 'REST API', 'Cart & Checkout', 'Firebase'],
                badges: [{ type: 'ios', label: 'App Store', href: '#' }]
            },
        };

        // ── Badge renderer ───────────────────────────────────
        function _badgeSVG(type) {
            if (type === 'ios') return `<svg class="badge-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>`;
            if (type === 'testflight') return `<svg class="badge-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm-1 14l-4-4 1.41-1.41L11 13.17l6.59-6.59L19 8l-8 8z"/></svg>`;
            if (type === 'google') return `<svg class="badge-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3.18 23.76c.37.21.8.21 1.2-.02l13.09-7.55-2.87-2.86L3.18 23.76zM.31 1.47C.12 1.8 0 2.21 0 2.68v18.64c0 .47.11.88.31 1.2l.07.06 10.44-10.44v-.24L.38 1.41l-.07.06zM20.54 9.53l-2.98-1.72-3.21 3.21 3.22 3.22 2.99-1.73c.85-.49.85-1.29-.02-1.98zM4.38.26L17.47 7.8l-2.87 2.87L3.18.26C3.56.03 3.99.03 4.38.26z"/></svg>`;
        }
        const _badgeMeta = {
            ios: { cls: 'badge badge-ios', small: 'DOWNLOAD ON THE' },
            testflight: { cls: 'badge badge-testflight', small: 'BETA AVAILABLE ON' },
            google: { cls: 'badge badge-google', small: 'GET IT ON' },
        };
        function badgeHTML(type, label, href) {
            const m = _badgeMeta[type];
            return `<a class="${m.cls}" href="${href || '#'}" target="_blank" rel="noopener">${_badgeSVG(type)}<span class="badge-text"><small>${m.small}</small><strong>${label}</strong></span></a>`;
        }

        // ── Load project from URL ?project=id ───────────────
        function loadProject(id) {
            const d = PROJECT_DATA[id];
            if (!d) {
                document.getElementById('detail-title').textContent = 'Project not found';
                return;
            }

            document.title = d.title + ' — Project Detail';

            const icon = document.getElementById('detail-icon');
            icon.style.background = d.gradient;
            icon.innerHTML = d.iconImg
                ? `<img src="${d.iconImg}" alt="${d.title} logo" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;" />`
                : d.icon;

            document.getElementById('detail-title').textContent = d.title;
            document.getElementById('detail-subtitle').textContent = d.subtitle;

            const ratingHTML = d.rating === '—'
                ? `<span class="category-tag">${d.category}</span>`
                : `<span class="category-tag">${d.category}</span>
                   <div style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-3)">
                     <span style="color:#f59e0b;font-size:13px;">★</span>
                     <span style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:#f59e0b">${d.rating}</span>
                     <span>· ${d.ratingCount}</span>
                   </div>`;
            document.getElementById('detail-tag-row').innerHTML = ratingHTML;

            const screensEl = document.getElementById('detail-screens');
            screensEl.innerHTML = d.screens.map((s, i) => `
  <div class="screen-frame">
    <div class="screen-placeholder" style="background:${s.bg};">
      ${s.img
                    ? `<img src="${s.img}" alt="screenshot ${i + 1}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;" />`
                    : s.icon
                }
    </div>
    <span class="screen-index">${i + 1}/${d.screens.length}</span>
  </div>`).join('');

            // Hide scrollbar cross-browser
            screensEl.style.msOverflowStyle = 'none';
            screensEl.style.setProperty('scrollbar-width', 'none');

            // Drag to scroll
            let isDown = false, startX, sl;
            screensEl.addEventListener('mousedown', e => {
                isDown = true;
                startX = e.pageX - screensEl.offsetLeft;
                sl = screensEl.scrollLeft;
                screensEl.style.cursor = 'grabbing';
                screensEl.style.scrollSnapType = 'none';
            });
            screensEl.addEventListener('mouseleave', () => { isDown = false; screensEl.style.cursor = 'grab'; screensEl.style.scrollSnapType = 'x mandatory'; });
            screensEl.addEventListener('mouseup', () => { isDown = false; screensEl.style.cursor = 'grab'; screensEl.style.scrollSnapType = 'x mandatory'; });
            screensEl.addEventListener('mousemove', e => {
                if (!isDown) return;
                e.preventDefault();
                screensEl.scrollLeft = sl - (e.pageX - screensEl.offsetLeft - startX) * 1.2;
            });

            document.getElementById('detail-desc').textContent = d.description;
            document.getElementById('detail-tech').innerHTML = d.tech.map(t => `<span class="tech-pill">${t}</span>`).join('');
            document.getElementById('detail-badges').innerHTML = d.badges.map(b => badgeHTML(b.type, b.label, b.href)).join('');
        }

        // ── Back button hover ────────────────────────────────
        const backBtn = document.getElementById('backBtn');
        backBtn.addEventListener('mouseenter', () => backBtn.style.color = 'var(--text)');
        backBtn.addEventListener('mouseleave', () => backBtn.style.color = 'var(--text-2)');

        // ── Init ─────────────────────────────────────────────
        const params = new URLSearchParams(location.search);
        const id = params.get('project') || '';
        loadProject(id);
    </script>

</body>

</html>
